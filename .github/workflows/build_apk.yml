name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Generate native Android project files
        run: flutter create --platforms=android --project-name karigar_setu --org com.sih.karigarsetu .

      - name: Add camera/microphone/internet permissions
        run: |
          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.CAMERA"/>\
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
              <uses-permission android:name="android.permission.INTERNET"/>' \
              android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karigar-setu-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
